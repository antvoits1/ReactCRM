name: Import ReactCRM Source

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore clean source
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk-* > /tmp/reactcrm.b64
          base64 -d /tmp/reactcrm.b64 > /tmp/reactcrm.zip
          rm -rf /tmp/reactcrm-src
          mkdir -p /tmp/reactcrm-src
          unzip -q /tmp/reactcrm.zip -d /tmp/reactcrm-src
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='.import' /tmp/reactcrm-src/ ./

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import repaired ReactCRM source"
          git push origin HEAD:main

# retry after archive chunk repair
