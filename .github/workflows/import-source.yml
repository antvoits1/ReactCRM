name: Import ReactCRM Source

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import repaired source archive
        shell: bash
        run: |
          cat > /tmp/reactcrm.b64 <<'B64'
[... trimmed for brevity in this display ...]UEsFBgAAAAAcABwAkwoAAF3CAAAAAA==
B64
          base64 -d /tmp/reactcrm.b64 > /tmp/reactcrm.zip
          rm -rf /tmp/reactcrm-src
          mkdir -p /tmp/reactcrm-src
          unzip -q /tmp/reactcrm.zip -d /tmp/reactcrm-src
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/reactcrm-src/ReactCRM-003-20260913-Repair1-8/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import repaired ReactCRM source"
          git push origin HEAD:main
