name: Build Vercel Artifact

on:
  push:
    paths:
      - '.github/workflows/build-vercel-artifact.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: reactcrm-dist
          path: dist
          if-no-files-found: error
