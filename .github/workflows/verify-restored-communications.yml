name: Verify Restored Communications Panel

on:
  push:
    paths:
      - '.github/workflows/verify-restored-communications.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
